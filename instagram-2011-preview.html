<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202020">
  <title>Nitra Space — Instagram 2011 náhľad</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #333;
      background: #d5d5d5;
      --blue: #4b83a5;
      --dark-blue: #345d78;
      --border: #bdbdbd;
      --shine: #fff;
      --surface: #f4f4f4;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(#e6e6e6, #cecece);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* Classic Instagram-era glossy blue toolbar around a light content area. */
    .topbar {
      position: relative;
      z-index: 2;
      height: 58px;
      flex: 0 0 58px;
      color: #f8f8f8;
      background: linear-gradient(#78a9c9 0%, #5b90b4 46%, #3f789f 50%, #4d86aa 100%);
      border-top: 1px solid #a9c9dc;
      border-bottom: 1px solid #275573;
      box-shadow: inset 0 1px #ffffff24, 0 1px 4px #0004;
      text-shadow: 0 -1px #315d79;
    }
    .topbar-inner {
      width: min(100%, 1000px);
      height: 100%;
      margin: auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .brand-home {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      color: #fff;
    }
    .brand-center {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.4px;
      white-space: nowrap;
    }
    .camera {
      position: relative;
      width: 23px;
      height: 18px;
      border: 2px solid #f5f5f5;
      border-radius: 4px;
      box-shadow: inset 0 1px #ffffffa0, 0 1px #315d79;
    }
    .camera::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 4px;
      left: 4px;
      top: -6px;
      border: 2px solid #eee;
      border-bottom: 0;
      border-radius: 3px 3px 0 0;
    }
    .camera::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      left: 6px;
      top: 3px;
      border: 2px solid #eee;
      border-radius: 50%;
    }
    .bar-actions { justify-self: end; display: flex; gap: 7px; }
    .bar-button {
      width: 34px;
      height: 31px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(#8bb6d1, #5e91b2 48%, #3e7397 50%, #5386a6);
      border: 1px solid #315e7a;
      border-radius: 4px;
      box-shadow: inset 0 1px #ffffffaa, 0 1px #315d79;
    }
    .bar-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }

    .app-main {
      width: min(100%, 1000px);
      min-height: 0;
      flex: 1;
      margin: 14px auto;
      padding: 0 14px;
      display: flex;
    }
    .screen-frame {
      min-width: 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fafafa;
      border: 1px solid #b7b7b7;
      border-radius: 4px;
      box-shadow: inset 0 1px #fff, 0 2px 5px #0003;
    }
    #screen { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .screen-head {
      min-height: 54px;
      padding: 8px 13px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(#fff, #f1f1f1 47%, #e2e2e2 50%, #f6f6f6);
      border-bottom: 1px solid #c5c5c5;
      box-shadow: inset 0 1px #fff;
    }
    .screen-heading { min-width: 0; }
    .screen-heading small {
      display: block;
      margin-bottom: 3px;
      color: var(--blue);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.3px;
    }
    .screen-heading h1 {
      margin: 0;
      color: #393939;
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 1px #fff;
    }
    .segmented {
      flex: 0 0 auto;
      padding: 2px;
      display: flex;
      background: linear-gradient(#d8d8d8, #f5f5f5 48%, #cfcfcf 50%, #eee);
      border: 1px solid #aaa;
      border-radius: 4px;
      box-shadow: inset 0 1px 2px #0002, 0 1px #fff;
    }
    .segmented button {
      min-height: 27px;
      padding: 0 10px;
      color: #555;
      background: transparent;
      border: 0;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      text-shadow: 0 1px #fff;
    }
    .segmented button.active {
      color: white;
      background: linear-gradient(#80a7c0, #527c99 48%, #3e6885 50%, #6288a2);
      box-shadow: inset 0 1px #ffffff9c, 0 1px 2px #0003;
      text-shadow: 0 -1px #355a73;
    }
    .status {
      min-height: 35px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #777;
      background: linear-gradient(#fcfcfc, #efefef 48%, #e1e1e1 50%, #f5f5f5);
      border-bottom: 1px solid #d0d0d0;
      font-size: 10px;
    }
    .status-left { display: inline-flex; align-items: center; gap: 7px; }
    .status b { color: #527995; }
    .status-led {
      width: 8px;
      height: 8px;
      border: 1px solid #5c934d;
      border-radius: 50%;
      background: linear-gradient(#d2f3b4, #76ad5d);
      box-shadow: 0 0 3px #9c8;
    }
    .content {
      min-height: 0;
      flex: 1;
      overflow: auto;
      background: linear-gradient(#fff, #f7f7f7);
      box-shadow: inset 0 1px 4px #0000000b;
    }

    /* Existing chat, presented as compact message rows rather than a new feature. */
    .chat-log { padding: 15px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
    .time-pill {
      align-self: center;
      padding: 4px 9px;
      color: #999;
      background: linear-gradient(#fff, #ececec);
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      box-shadow: 0 1px 1px #0001;
      font-size: 9px;
      font-weight: 700;
      text-shadow: 0 1px #fff;
    }
    .bubble-row { max-width: 82%; display: flex; align-items: flex-end; gap: 7px; }
    .bubble-row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      color: #62839b;
      background: linear-gradient(#fff, #d8d8d8);
      border: 1px solid #aaa;
      border-radius: 4px;
      box-shadow: inset 0 1px #fff, 0 1px 1px #0002;
      font-size: 11px;
      font-weight: 700;
    }
    .bubble-wrap { min-width: 0; }
    .bubble-name {
      display: block;
      margin: 0 0 3px 2px;
      color: #999;
      font-size: 9px;
      font-weight: 700;
      text-shadow: 0 1px #fff;
    }
    .bubble-row.mine .bubble-name { margin-right: 2px; text-align: right; }
    .bubble {
      position: relative;
      padding: 8px 10px;
      color: #444;
      background: linear-gradient(#fff, #eee 48%, #e4e4e4 50%, #fafafa);
      border: 1px solid #b9b9b9;
      border-radius: 6px;
      box-shadow: inset 0 1px #fff, 0 1px 1px #0002;
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .bubble-row:not(.mine) .bubble::before, .bubble-row.mine .bubble::before {
      content: "";
      position: absolute;
      bottom: 7px;
      width: 7px;
      height: 7px;
      transform: rotate(45deg);
    }
    .bubble-row:not(.mine) .bubble::before {
      left: -5px;
      background: #eee;
      border-left: 1px solid #b9b9b9;
      border-bottom: 1px solid #b9b9b9;
    }
    .bubble-row.mine .bubble {
      color: #fff;
      background: linear-gradient(#99b9cf, #6c92ad 48%, #547e9b 50%, #7196b0);
      border-color: #547993;
      box-shadow: inset 0 1px #ffffff9c, 0 1px 1px #0003;
      text-shadow: 0 -1px #456981;
    }
    .bubble-row.mine .bubble::before {
      right: -5px;
      background: #547e9b;
      border-right: 1px solid #547993;
      border-bottom: 1px solid #547993;
    }
    .typing { margin-left: 35px; color: #999; font-size: 10px; font-style: italic; }
    .typing b { color: #6c91a8; letter-spacing: 2px; }

    .compose {
      flex: 0 0 auto;
      padding: 8px 9px;
      background: linear-gradient(#eee, #dcdcdc 48%, #cecece 50%, #ededed);
      border-top: 1px solid #c3c3c3;
      box-shadow: inset 0 1px #fff;
    }
    .compose-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 7px; align-items: stretch; }
    .compose-group { display: flex; gap: 5px; }
    .old-btn {
      min-height: 38px;
      padding: 0 11px;
      color: #555;
      background: linear-gradient(#fff, #eee 48%, #d5d5d5 50%, #fafafa);
      border: 1px solid #999;
      border-radius: 4px;
      box-shadow: inset 0 1px #fff, 0 1px 2px #0002;
      font-size: 10px;
      font-weight: 700;
      text-shadow: 0 1px #fff;
    }
    .old-btn.primary {
      color: #fff;
      background: linear-gradient(#83a8c0, #5b83a0 48%, #416b88 50%, #668ca6);
      border-color: #3a617b;
      box-shadow: inset 0 1px #ffffff9c, 0 1px 2px #0003;
      text-shadow: 0 -1px #31546c;
    }
    .compose-input {
      min-width: 0;
      display: flex;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 4px;
      box-shadow: inset 0 1px 3px #0002, 0 1px #fff;
    }
    .compose-input input {
      width: 100%;
      min-width: 0;
      padding: 0 10px;
      color: #444;
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 13px;
    }
    .compose-input input::placeholder { color: #aaa; }

    /* Existing section views: no added sections or controls. */
    .nitra-messages { padding: 7px 13px; }
    .nitra-message {
      display: grid;
      grid-template-columns: 31px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 10px 2px;
      border-bottom: 1px solid #d5d5d5;
    }
    .nitra-message .avatar { width: 30px; height: 30px; }
    .nitra-message b { color: #527995; font-size: 11px; }
    .nitra-message p { margin: 3px 0 0; color: #626262; font-size: 12px; }
    .nitra-message small { color: #aaa; font-size: 9px; }
    .nitra-compose {
      display: flex;
      gap: 7px;
      padding: 9px;
      background: linear-gradient(#eee, #ddd);
      border-top: 1px solid #c7c7c7;
    }
    .nitra-compose input {
      min-width: 0;
      flex: 1;
      padding: 0 9px;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 4px;
      box-shadow: inset 0 1px 3px #0002;
    }
    .event-list { padding: 11px; display: grid; gap: 10px; align-content: start; }
    .event-card {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      overflow: hidden;
      background: linear-gradient(#fff, #f1f1f1);
      border: 1px solid #bbb;
      border-radius: 4px;
      box-shadow: inset 0 1px #fff, 0 1px 2px #0002;
    }
    .event-card img { width: 100%; height: 150px; object-fit: cover; filter: saturate(.8) contrast(1.04); }
    .event-info { padding: 13px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 7px; }
    .event-info small { color: #999; font-size: 9px; font-weight: 700; letter-spacing: .6px; }
    .event-info h2 { margin: 0; color: #444; font-size: 17px; }
    .event-info p { margin: 0; color: #777; font-size: 11px; line-height: 1.4; }
    .event-info a { margin-top: 2px; color: var(--blue); font-size: 10px; font-weight: 700; }
    .room-card { min-height:82px; grid-template-columns:70px minmax(0,1fr); align-items:center; }
    .room-number { width:46px; height:46px; margin:auto; display:grid; place-items:center; color:#fff; font-size:17px; font-weight:700; text-shadow:0 1px #315d79; background:linear-gradient(#8ab6d0,#4b83a5 52%,#3c6f8e); border:1px solid #3b6e8c; border-radius:5px; box-shadow:inset 0 1px #ffffff99,0 1px 2px #0003; }
    .room-card .event-info { gap:5px; }
    .room-card .event-info span { color:var(--blue); font-size:10px; font-weight:700; }
    .profile {
      width: min(430px, calc(100% - 24px));
      margin: 20px auto;
      padding: 16px;
      background: linear-gradient(#fff, #eee);
      border: 1px solid #bbb;
      border-radius: 4px;
      box-shadow: inset 0 1px #fff, 0 1px 3px #0002;
    }
    .profile h2 { margin: 0 0 14px; color: #555; font-size: 17px; }
    .profile label { display: block; margin: 11px 0; color: #888; font-size: 10px; font-weight: 700; }
    .profile input {
      display: block;
      width: 100%;
      height: 36px;
      margin-top: 5px;
      padding: 0 9px;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 4px;
      box-shadow: inset 0 1px 3px #0002;
      font-size: 13px;
    }
    .profile-actions { display: flex; gap: 7px; margin-top: 14px; }
    .profile-actions .old-btn { flex: 1; }
    .profile-note { margin: 12px 0 0; color: var(--blue); font-size: 10px; }

    .bottom-tabs {
      height: 62px;
      flex: 0 0 62px;
      z-index: 2;
      background: linear-gradient(#292929, #101010 48%, #050505 50%, #161616);
      border-top: 1px solid #555;
      box-shadow: 0 -1px 4px #0003;
    }
    .tabs {
      width: min(100%, 1000px);
      height: 100%;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #aaa;
      font-size: 9px;
      text-shadow: 0 -1px #000;
    }
    .tab-icon { height: 22px; display: grid; place-items: center; color: #bbb; font-size: 19px; line-height: 1; }
    .tab.active { color: #fff; }
    .tab.active .tab-icon { color: #fff; text-shadow: 0 0 4px #8ac5ed; }

    @media (max-width: 620px) {
      html, body { height: 100%; overflow: hidden; }
      .topbar { height: 52px; flex-basis: 52px; }
      .topbar-inner { padding: 0 10px; }
      .camera { transform: scale(.9); }
      .brand-center { font-size: 15px; }
      .bar-button { width: 31px; height: 29px; }
      .app-main { width: 100%; margin: 0; padding: 0; }
      .screen-frame { border: 0; border-radius: 0; box-shadow: none; }
      .screen-head { min-height: 48px; padding: 7px 9px; }
      .screen-heading h1 { font-size: 15px; }
      .screen-heading small { font-size: 8px; }
      .segmented button { min-height: 25px; padding: 0 7px; font-size: 9px; }
      .status { min-height: 32px; padding: 0 9px; }
      .chat-log { padding: 12px 10px 15px; gap: 11px; }
      .bubble-row { max-width: 88%; }
      .bubble { padding: 8px 9px; font-size: 12px; }
      .compose { padding: 7px 6px calc(7px + env(safe-area-inset-bottom)); }
      .compose-row { grid-template-columns: minmax(0, 1fr) auto; gap: 5px; }
      .compose-input { height: 38px; }
      .compose-group { grid-column: 1 / -1; grid-row: 2; }
      .compose-group .old-btn { flex: 1; min-height: 32px; padding: 0 6px; font-size: 9px; }
      .compose-group .leave { flex: 0 0 72px; }
      .compose-row .send { min-width: 70px; padding: 0 7px; }
      .bottom-tabs { height: 59px; flex-basis: 59px; padding-bottom: env(safe-area-inset-bottom); }
      .tab { font-size: 8px; }
      .tab-icon { height: 21px; font-size: 18px; }
      .event-list { padding: 7px; gap: 7px; }
      .event-card { grid-template-columns: 38% 62%; }
      .event-card img { height: 130px; }
      .event-info { padding: 9px; gap: 5px; }
      .event-info h2 { font-size: 14px; }
      .event-info p { font-size: 10px; }
      .event-info a { font-size: 9px; }
      .profile { margin: 14px auto; }
      .nitra-message { grid-template-columns: 29px minmax(0, 1fr) auto; gap: 7px; padding: 9px 0; }
      .nitra-message p { font-size: 11px; }
    }
    @media (max-width: 360px) {
      .topbar-inner { padding: 0 7px; }
      .brand-center { font-size: 14px; }
      .bar-actions { gap: 4px; }
      .screen-heading h1 { font-size: 13px; }
      .segmented button { padding: 0 5px; font-size: 8px; }
      .event-info h2 { font-size: 12px; }
      .event-info p { font-size: 9px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand-home" href="#chat" aria-label="Chaty"><span class="camera" aria-hidden="true"></span></a>
      <div class="brand-center">NITRA SPACE</div>
      <div class="bar-actions">
        <a class="bar-button" href="#account" aria-label="Účet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"></circle><path d="M4.7 20c.2-4 3-6.2 7.3-6.2s7.1 2.2 7.3 6.2z"></path></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="screen-frame" aria-live="polite">
      <div id="screen"></div>
    </section>
  </main>

  <nav class="bottom-tabs" aria-label="Menu Nitra Space">
    <div class="tabs">
      <a class="tab" href="#chat" data-route="chat"><span class="tab-icon">▣</span><span>Chaty</span></a>
      <a class="tab" href="#rooms" data-route="rooms"><span class="tab-icon">♙</span><span>Roomky</span></a>
      <a class="tab" href="#events" data-route="events"><span class="tab-icon">◇</span><span>Eventy</span></a>
      <a class="tab" href="#account" data-route="account"><span class="tab-icon">◉</span><span>Účet</span></a>
    </div>
  </nav>

  <script>
    const screen = document.getElementById("screen");

    const pages = {
      chat: {
        title: "Chaty",
        html: '<div class="screen-head"><div class="screen-heading"><small>NITRA SPACE · CHATY</small><h1>Náhodné spojenie</h1></div><div class="segmented"><button class="active" type="button">Anonym chat</button><button type="button">Video chat</button></div></div><div class="status"><span class="status-left"><i class="status-led"></i><b>Pripojený</b></span><span><b>7 ONLINE</b></span></div><div class="content chat-log" id="chatLog"><span class="time-pill">DNES · NITRA</span><article class="bubble-row"><span class="avatar">N</span><div class="bubble-wrap"><span class="bubble-name">CUDZÍ · pred chvíľou</span><div class="bubble">Ahoj, si z Nitry?</div></div></article><article class="bubble-row mine"><span class="avatar">D</span><div class="bubble-wrap"><span class="bubble-name">TY · teraz</span><div class="bubble">Čau, áno 🙂</div></div></article><article class="bubble-row"><span class="avatar">N</span><div class="bubble-wrap"><span class="bubble-name">CUDZÍ · teraz</span><div class="bubble">Super, kam chodíš najradšej večer?</div></div></article><div class="typing">Cudzí píše <b>•••</b></div></div><form class="compose" id="chatCompose"><div class="compose-row"><div class="compose-group"><button class="old-btn" type="button">Ďalší</button><button class="old-btn leave" type="button">Odísť</button></div><label class="compose-input"><input name="message" placeholder="Napíš správu…" aria-label="Napíš správu"></label><button class="old-btn primary send" type="submit">Odoslať</button></div></form>'
      },
      rooms: {
        title: "Školské roomky",
        html: '<div class="screen-head"><div class="screen-heading"><small>NITRA SPACE · KOMUNITA</small><h1>Školské roomky</h1></div></div><div class="status"><span class="status-left"><i class="status-led"></i><b>Stredné školy a gymnáziá</b></span><span>22 ROOMIEK</span></div><div class="content event-list room-list">'+[['Animus','Súkromná škola'],['Obchodka','Ekonomika'],['Cabajská · stavebná','Technika'],['Cabajská · potravinárska','Potravinárstvo'],['Cintorínska','Technika a služby'],['Červeňova','Odborné štúdium'],['Veterina','Zvieratá'],['GCM','Gymnázium'],['Zdravotka','Zdravotníctvo'],['Fraňa Kráľa','Priemyslovka'],['Golianka','Gymnázium'],['Konzervatórium','Hudba a umenie'],['Gastro','Gastronómia'],['Nábrežie','Stavebníctvo'],['Polytechnika','Polytechnika'],['Párovská','Gymnázium'],['Piaristi','Gymnázium'],['Samova','Umenie'],['Slančíkova · gym','Gymnázium'],['Hotelovka','Hoteliérstvo'],['Slančíkova · potravinárska','Potravinárstvo'],['Športová','Šport']].map((s,i)=>'<a class="event-card room-card" href="#room-'+(i+1)+'"><div class="room-number">'+String(i+1).padStart(2,'0')+'</div><div class="event-info"><small>'+s[1].toUpperCase()+'</small><h2>'+s[0]+'</h2><p>Anonymná chat miestnosť</p><span>Otvoriť roomku&nbsp; ↗</span></div></a>').join('')+'</div>'
      },
      events: {
        title: "Eventy",
        html: '<div class="screen-head"><div class="screen-heading"><small>NITRA SPACE · MESTO</small><h1>Eventy</h1></div></div><div class="status"><span class="status-left"><i class="status-led"></i><b>Čo sa deje v meste</b></span><span>NAJBLIŽŠIE</span></div><div class="content event-list"><article class="event-card"><img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=480&q=78" alt="Koncertné svetlá a publikum"><div class="event-info"><small>4. DECEMBER · LUNA</small><h2>RapLounge</h2><p>Danisen, Bari, RuckFiso, Emmsalvatore</p><a href="#events">Chat eventu&nbsp; ↗</a></div></article><article class="event-card"><img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=480&q=78" alt="Pódium na hudobnej akcii"><div class="event-info"><small>HUDOBNÁ NOC · NITRA</small><h2>Víkend v meste</h2><p>Hudba, priatelia a Nitra po zotmení.</p><a href="#events">Zobraziť detail&nbsp; ↗</a></div></article></div>'
      },
      account: {
        title: "Účet",
        html: '<div class="screen-head"><div class="screen-heading"><small>NITRA SPACE</small><h1>Účet</h1></div></div><div class="status"><span class="status-left"><i class="status-led"></i><b>Vitaj späť</b></span><span>PRIHLÁSENIE</span></div><div class="content"><form class="profile"><h2>Prihlás sa do Nitra Space</h2><label>E-mail<input type="email" placeholder="tvoj@email.sk"></label><label>Heslo<input type="password" placeholder="Heslo"></label><div class="profile-actions"><button class="old-btn primary" type="button">Prihlásiť sa</button><button class="old-btn" type="button">Vytvoriť účet</button></div><p class="profile-note">Zabudol som heslo</p></form></div>'
      }
    };

    function renderPage() {
      const hash = window.location.hash.slice(1).split("?")[0] || "chat";
      const roomMatch = hash.match(/^room-(\d+)$/);
      const route = roomMatch ? "rooms" : hash;
      const page = pages[route] || pages.chat;
      if (roomMatch) {
        const rooms = [['Animus','Súkromná škola'],['Obchodka','Ekonomika'],['Cabajská · stavebná','Technika'],['Cabajská · potravinárska','Potravinárstvo'],['Cintorínska','Technika a služby'],['Červeňova','Odborné štúdium'],['Veterina','Zvieratá'],['GCM','Gymnázium'],['Zdravotka','Zdravotníctvo'],['Fraňa Kráľa','Priemyslovka'],['Golianka','Gymnázium'],['Konzervatórium','Hudba a umenie'],['Gastro','Gastronómia'],['Nábrežie','Stavebníctvo'],['Polytechnika','Polytechnika'],['Párovská','Gymnázium'],['Piaristi','Gymnázium'],['Samova','Umenie'],['Slančíkova · gym','Gymnázium'],['Hotelovka','Hoteliérstvo'],['Slančíkova · potravinárska','Potravinárstvo'],['Športová','Šport']];
        const room = rooms[Number(roomMatch[1])-1] || rooms[0];
        screen.innerHTML = '<div class="screen-head"><div class="screen-heading"><small><a href="#rooms">← VŠETKY ROOMKY</a> · NITRA SPACE</small><h1>'+room[0]+'</h1></div></div><div class="status"><span class="status-left"><i class="status-led"></i><b>Pripojený</b></span><span><b>7 ONLINE</b></span></div><div class="content chat-log"><span class="time-pill">DNES · ŠKOLSKÁ ROOMKA</span><article class="bubble-row"><span class="avatar">N</span><div class="bubble-wrap"><span class="bubble-name">ŠTUDENT · pred chvíľou</span><div class="bubble">Čaute, kto je tu z našej školy?</div></div></article><article class="bubble-row mine"><span class="avatar">D</span><div class="bubble-wrap"><span class="bubble-name">TY · teraz</span><div class="bubble">Ja som tu 👋</div></div></article><div class="typing">Niekto píše <b>•••</b></div></div><form class="compose"><div class="compose-row"><div class="compose-group"><a class="old-btn" href="#room-'+(Number(roomMatch[1])%22+1)+'">Ďalší</a><a class="old-btn leave" href="#rooms">Odísť</a></div><label class="compose-input"><input placeholder="Napíš správu…" aria-label="Napíš správu"></label><button class="old-btn primary send" type="button">Odoslať</button></div></form>';
      } else screen.innerHTML = page.html;
      document.querySelectorAll("[data-route]").forEach(function (link) {
        const active = link.dataset.route === route;
        link.classList.toggle("active", active);
        if (active) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });

      const form = document.getElementById("chatCompose");
      if (form) form.addEventListener("submit", function (event) {
        event.preventDefault();
        const input = form.elements.message;
        const message = input.value.trim();
        if (!message) return;
        const row = document.createElement("article");
        row.className = "bubble-row mine";
        row.innerHTML = '<span class="avatar">D</span><div class="bubble-wrap"><span class="bubble-name">TY · teraz</span><div class="bubble"></div></div>';
        row.querySelector(".bubble").textContent = message;
        document.getElementById("chatLog").appendChild(row);
        input.value = "";
        document.getElementById("chatLog").scrollTop = document.getElementById("chatLog").scrollHeight;
      });
    }
    window.addEventListener("hashchange", renderPage);
    renderPage();
  </script>
</body>
