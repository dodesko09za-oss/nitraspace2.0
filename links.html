<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050607">
    <meta name="description" content="Všetky odkazy Nitra Space na jednom mieste.">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/nitra-space-192.png">
    <link rel="apple-touch-icon" href="/icons/nitra-space-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <title>Nitra Space — odkazy</title>
  </head>
  <body>
    <main class="linktree">
      <div class="linktree-atmosphere" aria-hidden="true"><img src="/chrome-sculpture.png" alt=""></div>
      <div class="linktree-content">
        <a class="linktree-wordmark" href="https://www.nitraspace.sk/space#chat" aria-label="Nitra Space">
          <span>NITRA</span><span>SPACE</span>
        </a>
        <p class="linktree-kicker">NITRA · SLOVAKIA</p>
        <h1>VŠETKY<br>MOJE LINKY.</h1>
        <p class="linktree-description">Vyber si, kam chceš ísť.</p>
        <nav class="linktree-links" aria-label="Odkazy Nitra Space">
          <a class="linktree-link" href="https://www.nitraspace.sk/space#chat">
            <span class="linktree-icon">N</span>
            <span class="linktree-copy"><strong>Nitra Space</strong><small>Chat a komunita v Nitre</small></span>
            <span class="linktree-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="linktree-link" href="https://tellonym.me/nitraspace" target="_blank" rel="noopener noreferrer">
            <span class="linktree-icon tellonym-icon">?</span>
            <span class="linktree-copy"><strong>Tellonym</strong><small>Pošli anonymnú otázku</small></span>
            <span class="linktree-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
        <p class="linktree-footer">ONE CITY. ONE SPACE.<span>NITRASPACE.SK</span></p>
      </div>
    </main>
    <script type="module" src="/src/linktree.js"></script>
  </body>
</html>
