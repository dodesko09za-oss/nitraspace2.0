<head>

<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;color:#fff;background:radial-gradient(ellipse at 50% 48%,#302430,#100e15 70%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.phone{position:relative;isolation:isolate;container-type:inline-size;width:min(100vw,56.25svh);aspect-ratio:9/16;overflow:hidden;background:#1a1122;display:flex;flex-direction:column}
@media(min-width:620px){.phone{width:min(450px,52svh);border-radius:38px;outline:2px solid #59505d;box-shadow:0 0 0 7px #141216,0 25px 80px #0009}}
.wall{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse 126% 62% at 97% 93%,#251a40 20%,#825782 46%,#e69b9d 58%,#fbc6b3 60%,#a77393 61%,transparent 67%),radial-gradient(ellipse 117% 76% at -16% 25%,#25243c 25%,#4a3453 54%,#8a5380 63%,#e0a2b2 70%,#552d4b 71%,#281a30 84%,#100d17 100%)}
.status{display:flex;align-items:center;justify-content:space-between;margin:3.6cqw 7cqw 0;font-size:3.9cqw;line-height:1.1;font-weight:650;font-variant-numeric:tabular-nums}
.indicators{display:flex;align-items:center;gap:1cqw;color:#fff}.signal{display:flex;align-items:flex-end;gap:.45cqw;height:2.7cqw}.signal i{width:.7cqw;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:30%}.signal i:nth-child(2){height:55%}.signal i:nth-child(3){height:80%}.signal i:last-child{height:100%}.battery{width:5.1cqw;height:2.6cqw;border:1px solid #fff9;padding:1px;border-radius:3px;position:relative}.battery:before{content:'';display:block;width:100%;height:100%;background:white;border-radius:1px}.battery:after{content:'';position:absolute;left:103%;top:28%;height:44%;width:1px;background:#fff}
.apps{margin:8cqw 5cqw;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;column-gap:2cqw}
.weather{grid-column:span 2;display:flex;flex-direction:column;aspect-ratio:1;border-radius:6cqw;padding:3.7cqw;color:#fff;text-decoration:none;background:radial-gradient(ellipse at 102% 2%,#a5c7e4 0,transparent 60%),linear-gradient(150deg,#476783,#23354e 90%);box-shadow:inset 0 1px #fff4,0 2px 6px #0003}
.city{font-size:4.2cqw;font-weight:600}.weather b{font-size:10.3cqw;line-height:1.1;letter-spacing:-.075em;font-weight:350}.weather-summary{margin-top:auto;font-size:3.2cqw;font-weight:600}.credit{font-size:2.25cqw;color:#d1deeb}.linktree-link{display:grid;justify-items:center;gap:1.45cqw;color:inherit;text-decoration:none;text-align:center}.linktree-link strong{font-size:3cqw;line-height:1.1;font-weight:520;text-shadow:0 1px 3px #000a}.linktree-icon{width:15.7cqw;aspect-ratio:1;display:grid;place-items:center;border-radius:25%;background:linear-gradient(160deg,var(--top),var(--base));box-shadow:inset 0 1px #ffffff88,0 2px 4px #100b1c40;transition:transform .16s}.linktree-icon svg{width:81%;height:81%}.linktree-link:active .linktree-icon{transform:scale(.93)}a:focus-visible{outline:3px solid white;outline-offset:3px}.chat-link{--top:#5cdbfd;--base:#2673d8}.school-link{--top:#ffe1aa;--base:#ff935a}.account-link{--top:#c1aaff;--base:#815ed7}.events-link{--top:#fff4e9;--base:#ffbfab}.tellonym-link{--top:#ff9acc;--base:#ee428b}
.signature{flex:1;min-height:0;display:grid;place-items:center;align-content:center;gap:1cqw;pointer-events:none}.signature img{width:57cqw;height:auto;max-height:44cqw;object-fit:contain;filter:drop-shadow(0 8px 16px #14071f66)}#day{font-size:3cqw;color:#fff;text-shadow:0 1px 4px #20152b;text-transform:capitalize}
.dock{margin:4cqw 3.2cqw 0;border-radius:8cqw;background:linear-gradient(135deg,#ffffff37,#ffffff1b);backdrop-filter:blur(24px) saturate(1.4);box-shadow:inset 0 1px #ffffff63,0 3px 14px #140c2633;display:grid;grid-template-columns:repeat(3,1fr);padding:3.3cqw 3cqw 2.7cqw}.dock strong{font-size:2.8cqw}.gesture{width:28%;height:1cqw;background:#fffc;border-radius:99px;margin:2.5cqw auto 1.7cqw}
.launch-surface {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  background: linear-gradient(155deg,var(--top),var(--base) 72%);
  pointer-events: none;
}
.launch-surface .linktree-icon { background: transparent; box-shadow: none; }
</style></head>

<script>
const timeZone='Europe/Bratislava';
function tick(){const now=new Date();clock.textContent=now.toLocaleTimeString('sk-SK',{timeZone,hour:'2-digit',minute:'2-digit'});day.textContent=now.toLocaleDateString('sk-SK',{timeZone,weekday:'short',day:'numeric',month:'short'});}
function calendarIcon(){const date=document.querySelector('.events-link text');if(date)date.textContent=new Intl.DateTimeFormat('sk-SK',{day:'numeric',timeZone}).format(new Date());}calendarIcon();setInterval(calendarIcon,60000);tick();setInterval(tick,1000);
async function weather(){try{
const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=48.31&longitude=18.09&current=temperature_2m,weather_code',{signal:AbortSignal.timeout(12000)});
if(!r.ok)throw Error();const {current}=await r.json();if(!Number.isFinite(current.temperature_2m))throw Error();
temp.textContent=Math.round(current.temperature_2m)+' °C';const w=current.weather_code;
forecast.textContent=w===0?'Jasno':w<=2?'Polojasno':w===3?'Zamračené':w<=48?'Hmla':w<=57?'Mrholenie':w<=67?'Dážď':w<=77?'Sneženie':w<=82?'Prehánky':w<=86?'Snehové prehánky':'Búrky';
}catch{temp.textContent='—';forecast.textContent='Počasie nedostupné';}}
weather();setInterval(weather,900000);
</script>
<script>
const phone = document.querySelector('.phone');
let opening = null;

function resetLauncher() {
  opening?.remove();
  opening = null;
}

window.addEventListener('pageshow', resetLauncher);
for (const link of phone.querySelectorAll('.linktree-link')) {
  // Launch all apps in this window so the transition stays visible until navigation.
  if (link.target === '_blank') {
    link.removeAttribute('target');
    link.setAttribute('aria-label', link.textContent.trim());
  }
  link.addEventListener('click', async event => {
    if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    if (opening) {
      event.preventDefault();
      return;
    }
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) return;
    event.preventDefault();
    const icon = link.querySelector('.linktree-icon');
    const start = icon.getBoundingClientRect();
    const end = phone.getBoundingClientRect();
    const surface = document.createElement('div');
    surface.className = 'launch-surface';
    surface.setAttribute('aria-hidden', 'true');
    const colors = getComputedStyle(link);
    surface.style.setProperty('--top', colors.getPropertyValue('--top'));
    surface.style.setProperty('--base', colors.getPropertyValue('--base'));
    const glyph = icon.cloneNode(true);
    // The clone can reference the gradients already defined in the original SVG.
    glyph.querySelector('defs')?.remove();
    surface.append(glyph);
    phone.append(surface);
    opening = surface;
    const timing = {duration: 430, easing: 'cubic-bezier(.22,.76,.17,1)', fill: 'both'};
    const x = start.left + start.width / 2 - end.left - end.width / 2;
    const y = start.top + start.height / 2 - end.top - end.height / 2;
    try {
      glyph.animate([
        {transform: `translate(${x}px,${y}px) scale(1)`},
        {transform: 'translate(0,0) scale(1.45)'}
      ], timing);
      await surface.animate([
        {clipPath: `inset(${start.top-end.top}px ${end.right-start.right}px ${end.bottom-start.bottom}px ${start.left-end.left}px round ${start.width/4}px)`},
        {clipPath: 'inset(0px 0px 0px 0px round 0px)'}
      ], timing).finished;
    } finally {
      if (opening === surface) location.assign(link.href);
    }
  });
}
</script>
